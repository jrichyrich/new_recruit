name: Roster data freshness

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
    inputs:
      official_reconciliation_evidence:
        description: Optional HTTPS URL or checkout-relative official overlay JSON (requires source and receipt)
        required: false
        type: string
      official_source_artifact:
        description: Exact HTTPS or checkout-relative official source artifact covered by the overlay
        required: false
        type: string
      official_legend_source_artifacts:
        description: Optional JSON array of schema-v2 source-id=HTTPS-or-checkout-relative-path entries
        required: false
        type: string
      official_extraction_receipt:
        description: Signed reviewed-extractor receipt for the source and overlay
        required: false
        type: string
      official_authority_unavailable_reason:
        description: Explicit degraded genesis-channel reason when no reviewed official evidence exists
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: roster-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      ROSTERPILOT_DATA_SIGNING_KEY_ID: ${{ vars.ROSTERPILOT_DATA_SIGNING_KEY_ID }}
      ROSTERPILOT_DATA_SIGNING_PRIVATE_JWK: ${{ secrets.ROSTERPILOT_DATA_SIGNING_PRIVATE_JWK }}
      ROSTERPILOT_DATA_BUNDLE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/data-bundles
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - run: npm ci

      - name: Prepare the immutable channel worktree
        id: channel
        shell: bash
        run: |
          set -euo pipefail
          channel_root="$RUNNER_TEMP/rosterpilot-data-channel"
          if git fetch origin data-bundles; then
            git worktree add --detach "$channel_root" FETCH_HEAD
          else
            git worktree add --detach "$channel_root"
            git -C "$channel_root" switch --orphan data-bundles
            git -C "$channel_root" rm -rf . || true
          fi
          previous_manifest=""
          pointer="$channel_root/channels/stable.json"
          if test -f "$pointer"; then
            bundle_id="$(node -e 'const fs=require("fs"); const value=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); process.stdout.write(value.bundleId)' "$pointer")"
            previous_manifest="$channel_root/bundles/$bundle_id/manifest.json"
            test -f "$previous_manifest"
          fi
          echo "root=$channel_root" >> "$GITHUB_OUTPUT"
          echo "previous_manifest=$previous_manifest" >> "$GITHUB_OUTPUT"

      - name: Build, classify, and certify the candidate bundle
        shell: bash
        env:
          OFFICIAL_EVIDENCE_INPUT: ${{ inputs.official_reconciliation_evidence }}
          OFFICIAL_SOURCE_INPUT: ${{ inputs.official_source_artifact }}
          OFFICIAL_LEGEND_SOURCES_INPUT: ${{ inputs.official_legend_source_artifacts }}
          OFFICIAL_RECEIPT_INPUT: ${{ inputs.official_extraction_receipt }}
          OFFICIAL_UNAVAILABLE_REASON: ${{ inputs.official_authority_unavailable_reason }}
        run: |
          set -euo pipefail
          args=(
            --out-dir "${{ steps.channel.outputs.root }}"
            --channel stable
            --manifest-base-url "$ROSTERPILOT_DATA_BUNDLE_BASE_URL"
            --review-package-dir "$RUNNER_TEMP/rosterpilot-certification-review"
          )
          if test -n "${{ steps.channel.outputs.previous_manifest }}"; then
            args+=(--previous-manifest "${{ steps.channel.outputs.previous_manifest }}")
          fi
          official_evidence="$OFFICIAL_EVIDENCE_INPUT"
          official_source="$OFFICIAL_SOURCE_INPUT"
          official_legend_sources="$OFFICIAL_LEGEND_SOURCES_INPUT"
          official_receipt="$OFFICIAL_RECEIPT_INPUT"
          if { test -n "$official_evidence" || test -n "$official_source" || test -n "$official_legend_sources" || test -n "$official_receipt"; } && test -n "$OFFICIAL_UNAVAILABLE_REASON"; then
            echo "Official evidence and an unavailable-authority reason are mutually exclusive." >&2
            exit 1
          fi
          if test -n "$official_evidence" || test -n "$official_source" || test -n "$official_legend_sources" || test -n "$official_receipt"; then
            test -n "$official_evidence" && test -n "$official_source" && test -n "$official_receipt"
            if [[ "$official_evidence" == https://* ]]; then
              evidence_file="$RUNNER_TEMP/rosterpilot-official-overlay.json"
              curl --fail --show-error --silent --location \
                "$official_evidence" \
                --output "$evidence_file"
            else
              evidence_file="$GITHUB_WORKSPACE/$official_evidence"
            fi
            if [[ "$official_source" == https://* ]]; then
              source_file="$RUNNER_TEMP/rosterpilot-official-source"
              curl --fail --show-error --silent --location "$official_source" --output "$source_file"
            else
              source_file="$GITHUB_WORKSPACE/$official_source"
            fi
            if [[ "$official_receipt" == https://* ]]; then
              receipt_file="$RUNNER_TEMP/rosterpilot-official-receipt.json"
              curl --fail --show-error --silent --location "$official_receipt" --output "$receipt_file"
            else
              receipt_file="$GITHUB_WORKSPACE/$official_receipt"
            fi
            legend_entries_file="$RUNNER_TEMP/rosterpilot-official-legend-inputs.tsv"
            node --import tsx scripts/parse-official-legend-artifacts.ts \
              "$official_legend_sources" > "$legend_entries_file"
            official_check_args=(
              --file "$evidence_file"
              --source-artifact "$source_file"
              --receipt "$receipt_file"
            )
            official_build_args=(
              --official-reconciliation-evidence "$evidence_file"
              --official-source-artifact "$source_file"
              --official-extraction-receipt "$receipt_file"
            )
            legend_index=0
            while IFS=$'\t' read -r source_id artifact_input; do
              if [[ "$artifact_input" == https://* ]]; then
                artifact_file="$RUNNER_TEMP/rosterpilot-official-legend-$legend_index"
                curl --fail --show-error --silent --location "$artifact_input" --output "$artifact_file"
              else
                artifact_file="$GITHUB_WORKSPACE/$artifact_input"
              fi
              test -f "$artifact_file"
              official_check_args+=(--legend-source-artifact "$source_id=$artifact_file")
              official_build_args+=(--official-legend-source-artifact "$source_id=$artifact_file")
              legend_index=$((legend_index + 1))
            done < "$legend_entries_file"
            npm run data:official-overlay -- check "${official_check_args[@]}"
            args+=("${official_build_args[@]}")
          elif test -n "$OFFICIAL_UNAVAILABLE_REASON"; then
            args+=(--official-authority-unavailable "$OFFICIAL_UNAVAILABLE_REASON")
          fi
          npm run data:prepare-update -- "${args[@]}"

      - name: Preserve blocked certification review evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rosterpilot-certification-review-${{ github.run_id }}
          path: ${{ runner.temp }}/rosterpilot-certification-review
          if-no-files-found: ignore
          include-hidden-files: false
          retention-days: 90

      - name: Prove routine refresh did not rewrite the application checkout
        run: |
          git diff --exit-code
          test -z "$(git status --short)"

      - name: Publish the signed stable channel
        shell: bash
        run: |
          set -euo pipefail
          channel_root="${{ steps.channel.outputs.root }}"
          git -C "$channel_root" config user.name "github-actions[bot]"
          git -C "$channel_root" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$channel_root" add bundles channels
          if git -C "$channel_root" diff --cached --quiet; then
            echo "The signed channel is already current."
            exit 0
          fi
          git -C "$channel_root" commit -m "Publish verified roster data bundle"
          git -C "$channel_root" push origin HEAD:data-bundles

      - name: Preserve the published bundle as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rosterpilot-data-channel-${{ github.run_id }}
          path: ${{ steps.channel.outputs.root }}
          include-hidden-files: false
          retention-days: 30
