name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - run: npm ci
      - run: npm run verify

  deterministic-certification:
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1/4
          - 2/4
          - 3/4
          - 4/4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - run: npm ci
      - run: npm run certify -- --tier deterministic --portfolio --shard ${{ matrix.shard }} --out-dir .certification/${{ strategy.job-index }}

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-certification-${{ strategy.job-index }}
          path: .certification/${{ strategy.job-index }}
          if-no-files-found: error

  connector-fixtures:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - run: npm ci
      - name: Execute and certify recorded browser connector fixtures
        run: npm run certify -- --tier connector --faction adeptus-custodes --out-dir .certification/connector

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connector-certification
          path: .certification/connector
          if-no-files-found: error

  certification-trend:
    if: always()
    needs:
      - deterministic-certification
      - connector-fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: "*certification*"
          path: .certification/downloaded
      - run: npm run certify:trend -- --input .certification/downloaded --out .certification/certification-trend.md

      - uses: actions/upload-artifact@v4
        with:
          name: certification-trend
          path: |
            .certification/certification-trend.md
            .certification/downloaded/**/certification-report-*.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  portable-setup:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - run: npm ci
      - run: npm run doctor -- --profile core --non-interactive --refresh skip
      - run: npm run rosterpilot -- --help
