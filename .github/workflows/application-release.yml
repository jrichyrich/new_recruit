name: Application release assets

on:
  workflow_dispatch:
    inputs:
      official_reconciliation_evidence:
        description: Optional HTTPS URL or checkout-relative official overlay JSON (requires source and receipt)
        required: false
        type: string
      official_source_artifact:
        description: Exact HTTPS or checkout-relative official source artifact covered by the overlay
        required: false
        type: string
      official_legend_source_artifacts:
        description: Optional JSON array of schema-v2 source-id=HTTPS-or-checkout-relative-path entries
        required: false
        type: string
      official_extraction_receipt:
        description: Signed reviewed-extractor receipt for the source and overlay
        required: false
        type: string
      official_authority_unavailable_reason:
        description: Explicit degraded-release reason when no reviewed official evidence exists
        required: false
        type: string
      live_numerical_parity_run_id:
        description: Exact successful Live connector certification run ID supplying the numerical-parity rollout artifact once enforcement is active
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: rosterpilot-application-release
  cancel-in-progress: false

jobs:
  signed-bootstrap-and-build:
    runs-on: ubuntu-latest
    env:
      ROSTERPILOT_DATA_SIGNING_KEY_ID: ${{ vars.ROSTERPILOT_DATA_SIGNING_KEY_ID }}
      ROSTERPILOT_DATA_SIGNING_PRIVATE_JWK: ${{ secrets.ROSTERPILOT_DATA_SIGNING_PRIVATE_JWK }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - run: npm ci

      - id: provider-compatibility-latch
        name: Read the durable provider-compatibility latch
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: "tags/rosterpilot-provider-compatibility-enforced-v1",
              });
              core.setOutput("mode", "enforce");
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput("mode", "observe");
            }

      - id: numerical-parity-latch
        name: Read the durable live numerical-parity latch
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: "tags/rosterpilot-live-numerical-parity-enforced-v1",
              });
              core.setOutput("mode", "enforce");
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput("mode", "observe");
            }

      - id: numerical-parity-release-evidence
        name: Resolve exact live numerical-parity release evidence
        if: ${{ steps.numerical-parity-latch.outputs.mode == 'enforce' }}
        uses: actions/github-script@v7
        env:
          REQUESTED_RUN_ID: ${{ inputs.live_numerical_parity_run_id }}
        with:
          script: |
            const rawRunId = process.env.REQUESTED_RUN_ID ?? "";
            if (!/^[1-9][0-9]*$/.test(rawRunId)) {
              throw new Error("Numerical-parity enforcement requires the explicit live_numerical_parity_run_id workflow-dispatch input.");
            }
            const runId = Number(rawRunId);
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            const defaultBranch = context.payload.repository?.default_branch ?? "main";
            if (
              run.path !== ".github/workflows/certification-live.yml" ||
              run.head_branch !== defaultBranch ||
              run.conclusion !== "success" ||
              run.head_sha !== context.sha
            ) {
              throw new Error(`Live numerical-parity run ${runId} must be a successful certification-live.yml run on ${defaultBranch} at exact release SHA ${context.sha}; observed path=${run.path}, branch=${run.head_branch}, conclusion=${run.conclusion}, sha=${run.head_sha}.`);
            }
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
                per_page: 100,
              },
            );
            const evidenceName = `live-numerical-parity-evidence-${runId}`;
            const rolloutName = `live-numerical-parity-rollout-${runId}`;
            for (const artifactName of [evidenceName, rolloutName]) {
              const matches = artifacts.filter(
                (artifact) => artifact.name === artifactName && !artifact.expired,
              );
              if (matches.length !== 1) {
                throw new Error(`Live numerical-parity run ${runId} must retain exactly one unexpired ${artifactName} artifact.`);
              }
            }
            core.setOutput("run_id", rawRunId);
            core.setOutput("evidence_name", evidenceName);
            core.setOutput("rollout_name", rolloutName);

      - name: Download exact live numerical-parity raw evidence
        if: ${{ steps.numerical-parity-latch.outputs.mode == 'enforce' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.numerical-parity-release-evidence.outputs.evidence_name }}
          path: ${{ runner.temp }}/rosterpilot-live-numerical-parity/evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.numerical-parity-release-evidence.outputs.run_id }}

      - name: Download exact live numerical-parity rollout
        if: ${{ steps.numerical-parity-latch.outputs.mode == 'enforce' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.numerical-parity-release-evidence.outputs.rollout_name }}
          path: ${{ runner.temp }}/rosterpilot-live-numerical-parity/rollout
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.numerical-parity-release-evidence.outputs.run_id }}

      - name: Download the latest provider-compatibility rollout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          history_root=".certification/provider-compatibility-gate/history"
          mkdir -p "$history_root"
          while IFS= read -r prior_run_id; do
            prior_root="$history_root/$prior_run_id"
            mkdir -p "$prior_root"
            if gh run download "$prior_run_id" \
              --pattern "provider-compatibility-rollout-*" \
              --dir "$prior_root"; then
              break
            fi
            rm -rf "$prior_root"
          done < <(
            gh run list \
              --workflow certification-live.yml \
              --status completed \
              --limit 20 \
              --json databaseId \
              --jq '.[].databaseId'
          )

      - name: Apply the provider-compatibility release gate
        run: >-
          npm run certify:provider-compatibility --
          --reports-root .certification/provider-compatibility-gate/history
          --enforcement-latch ${{ steps.provider-compatibility-latch.outputs.mode }}
          --out .certification/provider-compatibility-gate/provider-compatibility-rollout-release-check.json

      - name: Resolve and validate optional official evidence
        id: official
        shell: bash
        env:
          OFFICIAL_EVIDENCE_INPUT: ${{ inputs.official_reconciliation_evidence }}
          OFFICIAL_SOURCE_INPUT: ${{ inputs.official_source_artifact }}
          OFFICIAL_LEGEND_SOURCES_INPUT: ${{ inputs.official_legend_source_artifacts }}
          OFFICIAL_RECEIPT_INPUT: ${{ inputs.official_extraction_receipt }}
          OFFICIAL_UNAVAILABLE_REASON: ${{ inputs.official_authority_unavailable_reason }}
        run: |
          set -euo pipefail
          official_evidence="$OFFICIAL_EVIDENCE_INPUT"
          official_source="$OFFICIAL_SOURCE_INPUT"
          official_legend_sources="$OFFICIAL_LEGEND_SOURCES_INPUT"
          official_receipt="$OFFICIAL_RECEIPT_INPUT"
          if { test -n "$official_evidence" || test -n "$official_source" || test -n "$official_legend_sources" || test -n "$official_receipt"; } && test -n "$OFFICIAL_UNAVAILABLE_REASON"; then
            echo "Official evidence and an unavailable-authority reason are mutually exclusive." >&2
            exit 1
          fi
          if test -z "$official_evidence" && test -z "$official_source" && test -z "$official_legend_sources" && test -z "$official_receipt"; then
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "source_path=" >> "$GITHUB_OUTPUT"
            echo "legend_map_path=" >> "$GITHUB_OUTPUT"
            echo "receipt_path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -n "$official_evidence" && test -n "$official_source" && test -n "$official_receipt"
          if [[ "$official_evidence" == https://* ]]; then
            evidence_file="$RUNNER_TEMP/rosterpilot-official-overlay.json"
            curl --fail --show-error --silent --location \
              "$official_evidence" \
              --output "$evidence_file"
          else
            evidence_file="$GITHUB_WORKSPACE/$official_evidence"
          fi
          if [[ "$official_source" == https://* ]]; then
            source_file="$RUNNER_TEMP/rosterpilot-official-source"
            curl --fail --show-error --silent --location "$official_source" --output "$source_file"
          else
            source_file="$GITHUB_WORKSPACE/$official_source"
          fi
          if [[ "$official_receipt" == https://* ]]; then
            receipt_file="$RUNNER_TEMP/rosterpilot-official-receipt.json"
            curl --fail --show-error --silent --location "$official_receipt" --output "$receipt_file"
          else
            receipt_file="$GITHUB_WORKSPACE/$official_receipt"
          fi
          legend_map_file="$RUNNER_TEMP/rosterpilot-official-legend-artifacts.txt"
          legend_entries_file="$RUNNER_TEMP/rosterpilot-official-legend-inputs.tsv"
          : > "$legend_map_file"
          node --import tsx scripts/parse-official-legend-artifacts.ts \
            "$official_legend_sources" > "$legend_entries_file"
          official_check_args=(
            --file "$evidence_file"
            --source-artifact "$source_file"
            --receipt "$receipt_file"
          )
          legend_index=0
          while IFS=$'\t' read -r source_id artifact_input; do
            if [[ "$artifact_input" == https://* ]]; then
              artifact_file="$RUNNER_TEMP/rosterpilot-official-legend-$legend_index"
              curl --fail --show-error --silent --location "$artifact_input" --output "$artifact_file"
            else
              artifact_file="$GITHUB_WORKSPACE/$artifact_input"
            fi
            test -f "$artifact_file"
            official_check_args+=(--legend-source-artifact "$source_id=$artifact_file")
            printf '%s=%s\n' "$source_id" "$artifact_file" >> "$legend_map_file"
            legend_index=$((legend_index + 1))
          done < "$legend_entries_file"
          npm run data:official-overlay -- check "${official_check_args[@]}"
          echo "path=$evidence_file" >> "$GITHUB_OUTPUT"
          echo "source_path=$source_file" >> "$GITHUB_OUTPUT"
          echo "legend_map_path=$legend_map_file" >> "$GITHUB_OUTPUT"
          echo "receipt_path=$receipt_file" >> "$GITHUB_OUTPUT"

      - name: Build and sign application bootstrap assets
        shell: bash
        env:
          OFFICIAL_EVIDENCE_PATH: ${{ steps.official.outputs.path }}
          OFFICIAL_LEGEND_MAP_PATH: ${{ steps.official.outputs.legend_map_path }}
          OFFICIAL_UNAVAILABLE_REASON: ${{ inputs.official_authority_unavailable_reason }}
        run: |
          set -euo pipefail
          args=()
          if test -n "$OFFICIAL_EVIDENCE_PATH"; then
            args+=(
              --official-reconciliation-evidence "$OFFICIAL_EVIDENCE_PATH"
              --official-source-artifact "${{ steps.official.outputs.source_path }}"
              --official-extraction-receipt "${{ steps.official.outputs.receipt_path }}"
            )
            while IFS= read -r legend_entry; do
              test -z "$legend_entry" && continue
              args+=(--official-legend-source-artifact "$legend_entry")
            done < "$OFFICIAL_LEGEND_MAP_PATH"
          elif test -n "$OFFICIAL_UNAVAILABLE_REASON"; then
            args+=(--official-authority-unavailable "$OFFICIAL_UNAVAILABLE_REASON")
          fi
          npm run data:bundle:prepare-release -- "${args[@]}"

      - name: Re-certify exact live numerical parity for this release
        if: ${{ steps.numerical-parity-latch.outputs.mode == 'enforce' }}
        shell: bash
        env:
          NUMERICAL_PARITY_RUN_ID: ${{ steps.numerical-parity-release-evidence.outputs.run_id }}
        run: |
          set -euo pipefail
          parity_root="$RUNNER_TEMP/rosterpilot-live-numerical-parity"
          evidence_root="$parity_root/evidence/input"
          rollout="$parity_root/rollout/live-numerical-parity-rollout-$NUMERICAL_PARITY_RUN_ID.json"
          rollout_checksum="$rollout.sha256"
          test -f "$rollout" && test ! -L "$rollout"
          test -f "$rollout_checksum" && test ! -L "$rollout_checksum"
          rollout_sha256="$(sha256sum "$rollout" | cut -d ' ' -f 1)"
          expected_checksum="$rollout_sha256  $(basename "$rollout")"
          test "$(tr -d '\n' < "$rollout_checksum")" = "$expected_checksum"
          node -e '
            const fs = require("fs");
            const [filename, runId] = process.argv.slice(1);
            const value = JSON.parse(fs.readFileSync(filename, "utf8"));
            if (
              value.reportKind !== "rosterpilot-live-numerical-parity-rollout" ||
              value.evaluation?.enforcementActive !== true ||
              value.evaluation?.releaseGate !== "pass" ||
              value.evaluation?.latestRotationId !== runId ||
              value.evaluation?.latestStatus !== "pass"
            ) process.exit(2);
          ' "$rollout" "$NUMERICAL_PARITY_RUN_ID"
          comparison="$evidence_root/provider-parity/tessera-provider-parity.json"
          test -f "$comparison" && test ! -L "$comparison"
          bundle_id="$(node -e '
            const fs = require("fs");
            const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!/^[a-f0-9]{64}$/.test(value.bundleId)) process.exit(2);
            process.stdout.write(value.bundleId);
          ' data/bootstrap-data-bundle/manifest.json)"
          release_check_root="$RUNNER_TEMP/rosterpilot-live-numerical-parity/release-check"
          mkdir -p "$release_check_root"
          npm run certify:provider-parity -- \
            --comparison "$comparison" \
            --reports-root "$evidence_root" \
            --expected-bundle-id "$bundle_id" \
            --expected-git-head "$GITHUB_SHA" \
            --rotation-id "$NUMERICAL_PARITY_RUN_ID" \
            --out "$release_check_root/live-numerical-parity-release-check.json"
          npm run certify:provider-parity-rollout -- \
            --reports-root "$release_check_root" \
            --current-rotation-id "$NUMERICAL_PARITY_RUN_ID" \
            --enforcement-latch enforce \
            --out "$release_check_root/live-numerical-parity-rollout-release-check.json"

      - name: Preserve release-bound numerical-parity checks
        if: ${{ always() && steps.numerical-parity-latch.outputs.mode == 'enforce' }}
        uses: actions/upload-artifact@v4
        with:
          name: live-numerical-parity-release-check-${{ github.run_id }}
          path: ${{ runner.temp }}/rosterpilot-live-numerical-parity/release-check
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 90

      - name: Require trusted local and hosted assets before build
        run: npm run build:release

      - name: Preserve verified application data assets
        uses: actions/upload-artifact@v4
        with:
          name: rosterpilot-application-data-assets-${{ github.run_id }}
          path: |
            data/bootstrap-data-bundle
            data/data-bundle-trusted-keys.json
            public/data-bundles
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 90
